name: Windows installer release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Accounting, API and MCP regression tests
        run: npm test
      - name: Native tray rendering and text layout regression tests
        run: npm run test:desktop
      - name: Build verified self-contained payload and offline installer
        run: npm run package:windows
      - name: Include native menu verification report
        shell: pwsh
        run: Copy-Item qa-output/tray-menu/report.json dist/tray-menu-verification.json
      - name: Install, render, upgrade and uninstall without system runtimes
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/*-setup.exe | Select-Object -First 1).FullName
          & ./scripts/test-windows-installer.ps1 -Installer $installer
      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; never replace published binaries." }
          gh release create $tag --target $env:GITHUB_SHA --draft --title "NetScope $version · Windows x64 安装包" --notes-file packaging/RELEASE-NOTES.md dist/*
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
